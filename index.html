<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Darjiling Landslide Web Map</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  <style>
    :root { --high:#e31a1c; --moderate:#ffdf00; --low:#33a02c; --panel:rgba(255,255,255,0.96); --text:#1f2937; --muted:#6b7280; --border:rgba(15,23,42,0.12); --shadow:0 12px 32px rgba(2,6,23,0.16); --radius:14px; }
    *{box-sizing:border-box} html,body,#map{height:100%;margin:0} body{font-family:'Inter',sans-serif;color:var(--text)}
    .legendbox{position:absolute;left:12px;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:12px 14px;z-index:1200;min-width:240px}
    .risk{bottom:130px}.susc{bottom:12px}
    .title{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
    .row{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:14px}
    .sw{width:18px;height:18px;border-radius:4px;border:1px solid rgba(0,0,0,.15);flex:0 0 18px}
    @media (max-width:640px){.legendbox{width:calc(100% - 24px);min-width:0}.risk{bottom:126px}.susc{bottom:12px}}
  </style>
</head>
<body>
  <div id="map"></div>
  <div class="legendbox risk">
    <div class="title">Settlement Landslide Risk </div>
    <div class="row"><span class="sw" style="background:#e31a1c"></span><span>3 - High risk </span></div>
    <div class="row"><span class="sw" style="background:#ffdf00"></span><span>2 - Moderate risk </span></div>
    <div class="row"><span class="sw" style="background:#33a02c"></span><span>1 - Low risk </span></div>
  </div>
  <div class="legendbox susc">
    <div class="title">Landslide Susceptibility</div>
    <div style="height:14px;border-radius:999px;background:linear-gradient(90deg,#33a02c 0%, #ffdf00 50%, #e31a1c 100%);border:1px solid rgba(0,0,0,.12);"></div>
    <div style="display:flex;justify-content:space-between;font-size:12px;color:#4b5563;margin-top:6px;"><span>0</span><span>0.5</span><span>1</span></div>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="https://unpkg.com/@tmcw/togeojson@5.8.0/dist/togeojson.umd.js"></script>
  <script>
    const map = L.map('map');
    const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19, attribution:'&copy; OpenStreetMap contributors'});
    const satellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {maxZoom:19, attribution:'Tiles &copy; Esri'}).addTo(map);
    const overlayBounds = [[26.4515872795647, 88.0015852336498], [27.2085975694923, 88.8763646573254]];
    const susceptibility = L.imageOverlay('./susceptibility.png', overlayBounds, {opacity:0.74});

    function riskValue(p){
  const vals = [
    p.COL5A517F6A81606F00,
    p.COL5A517F6A8101AC03,
    p.COL5A517F6A81FA2562,
    p.DN,
    p.dn,
    p._majority,
    p.majority
  ];
  for (const v of vals){
    const n = Number(v);
    if ([1,2,3].includes(n)) return n;
  }
  return 1;
}
    function riskColor(v){ return v===3 ? '#e31a1c' : v===2 ? '#ffdf00' : '#33a02c'; }
    function formatProperties(properties){
      const rows = Object.entries(properties||{})
        .filter(([k,v])=>v!==null&&v!==''&&v!==undefined)
        .map(([k,v])=>`<div style="margin-bottom:6px;"><strong>${k}</strong>: ${v}</div>`)
        .join('');
      return rows || '<strong>No attributes available</strong>';
    }

    function loadKml(filename){
      return fetch(`./${filename}`).then(r => { if(!r.ok) throw new Error(`HTTP ${r.status}`); return r.text(); }).then(kmlText => {
        const kmlDoc = new DOMParser().parseFromString(kmlText, 'text/xml');
        if (kmlDoc.getElementsByTagName('parsererror').length) throw new Error('XML parser error');
        const geojson = (window.toGeoJSON || window.togeojson || togeojson).kml(kmlDoc);
        const kmlLayer = L.geoJSON(geojson, {
          style: f => {
            const v = riskValue(f.properties||{});
            return {color:riskColor(v), weight:1.8, opacity:1, fillColor:riskColor(v), fillOpacity:0};
          },
          pointToLayer: (f, latlng) => {
            const v = riskValue(f.properties||{});
            return L.circleMarker(latlng, {radius:6, color:'#111827', weight:1, fillColor:riskColor(v), fillOpacity:1});
          },
          onEachFeature: (f, layer) => {
            const v = riskValue(f.properties||{});
            const label = v===3 ? '3 - High risk zone' : v===2 ? '2 - Moderate risk zone' : '1 - Low risk zone';
            layer.bindPopup(`<div><div style="margin-bottom:8px;"><strong>${label}</strong></div>${formatProperties(f.properties||{})}</div>`);
          }
        }).addTo(map);
        const bounds = kmlLayer.getBounds();
        if (bounds.isValid()) map.fitBounds(bounds, {padding:[20,20]}); else map.fitBounds(overlayBounds, {padding:[20,20]});
        L.control.layers({'OpenStreetMap':osm,'Satellite':satellite},{'Susceptibility Raster':susceptibility,'Settlement Risk KML':kmlLayer},{collapsed:false}).addTo(map);
      });
    }

    loadKml('SettlementRiskClasses.kml').catch(() => loadKml('SettlementRiskClasses.kml').catch(() => {
      map.fitBounds(overlayBounds, {padding:[20,20]});
      L.control.layers({'OpenStreetMap':osm,'Satellite':satellite},{'Susceptibility Raster':susceptibility},{collapsed:false}).addTo(map);
    }));
  </script>
</body>
</html>
